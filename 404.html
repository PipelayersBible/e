  }

  function schedule(ms) { clearTimeout(timer); timer = setTimeout(load, ms); }
  function showErr(text) { var e = $('err'); e.textContent = text; e.hidden = !text; }

  function load() {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    var sent = Date.now();
    fetch(URL_BASE + '/rest/v1/rpc/pb_em_view', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY }, body: JSON.stringify({ p_token: token }),
      credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', signal: ctl ? ctl.signal : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
    }).then(function (x) {
      clearTimeout(to);
      if (!x.ok || !x.body || typeof x.body !== 'object') throw new Error(x.status === 404 ? 'notinstalled' : 'http');
      var r = x.body, sn = d(r.server_now);
      if (sn) skew = sn.getTime() - Math.round((sent + Date.now()) / 2);
      lastCheck = now(); failN = 0; showErr('');
      if (r.status === 'open' || r.status === 'closed') { last = r; missSince = 0; render(r); foot(); schedule(EVERY_MS); return; }
      if (r.status === 'conflict') {
        last = null; clearTimeout(timer);
        message('This link can’t be shown — call the crew', ['The server can’t tell which permit this link belongs to, so it shows nothing rather than the wrong site.', 'Use the address and details in the text message, and call the crew.'], 'b-warn');
        foot(); return;
      }
      if (r.status === 'busy') { showErr('The server asked this page to slow down. Checking again in ' + (r.retry_s || 30) + ' s.'); schedule(Math.max(10, r.retry_s || 30) * 1000); return; }
      if (r.status === 'expired') {
        last = null; clearTimeout(timer);
        message('This link has expired', [r.why === 'ended' ? 'The crew stopped sharing this permit.' : r.why === 'closed' ? 'The permit was closed more than 3 days ago' + (r.closed_at ? ' (' + tm(r.closed_at) + ')' : '') + ', so its emergency information is no longer shared.' : 'Its emergency information is no longer shared.', 'Contact the contractor for the permit record.'], 'b-info');
        foot(); return;
      }
      // not_found: maybe the crew's phone has had no data yet; keep checking
      if (!missSince) missSince = Date.now();
      if (last) { showErr('The server no longer finds this link (checked ' + tm(lastCheck, true) + '). Showing what was last received.'); schedule(EVERY_MS); return; }
      message('No information for this link yet', [
        'The crew’s phone may not have been able to send the permit yet (no data signal) — this page checks again every 30 seconds' + (missSince ? ' (last checked ' + tm(lastCheck, true) + ')' : '') + '.',
        'Or the link was typed wrong: check the code against the text message' + (shownCode ? ' (this page read ' + shownCode + ')' : '') + '.',
        'Use the address and details in the text message, and call the crew.'], 'b-warn');
      foot(); schedule(Date.now() - missSince > 30 * 60000 ? 120000 : EVERY_MS);
    }).catch(function (e) {
      clearTimeout(to); failN++;
      var wait = Math.min(60000, 10000 * failN);
      var why = String(e && e.message) === 'notinstalled' ? 'This page isn’t connected to its server yet.' : 'Couldn’t reach the server' + (navigator.onLine === false ? ' (this computer is offline)' : '') + '.';
      if (last) { showErr(why + ' Showing what was received ' + tm(lastCheck, true) + '. Trying again in ' + Math.round(wait / 1000) + ' s.'); render(last); }
      else message('Couldn’t load the emergency information', [why + ' Trying again in ' + Math.round(wait / 1000) + ' s.', 'Meanwhile use the address and details in the text message, and call the crew.'], 'b-warn');
      foot(); schedule(wait);
    });
  }

  $('printBtn').addEventListener('click', function () { try { window.print(); } catch (e) {} });
  // a tab that comes back to the front checks at once; minute-old times are refreshed in between
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && token && (!last || Date.now() - (lastCheck - skew) > 15000)) schedule(0); });
  setInterval(function () { if (last && !$('view').hidden) render(last); }, 20000);

  if (!token) {
    message('This link is incomplete', ['The address should end with a 12-character code, like e.pipelayersbible.com/?7K3M9Q2XHW4P. Check it against the text message.'], 'b-warn');
    foot();
  } else load();
})();
</script>
</body>
</html>
